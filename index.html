<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b17"><meta name="description" content="VORTEX AI - your personal AI assistant"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><title>VORTEX AI</title><link rel="stylesheet" href="./style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="logo">✦</span><span>VORTEX <b>AI</b></span></div><button id="newChat" class="new">＋ New chat</button><div class="side-note">Private chats are saved on this device.</div><div class="side-bottom"><span class="online-dot"></span> Local AI powered by Ollama</div></aside><main class="main"><header><button id="menu" aria-label="Menu">☰</button><div class="headbrand">✦ VORTEX AI <span class="tag">FREE</span></div><button id="clear" title="Clear conversation">↺</button></header><section id="messages" class="messages" aria-live="polite"><div id="welcome" class="welcome"><div class="hero-icon">✦</div><h1>Welcome to <em>VORTEX AI</em></h1><p>Your ideas, powered by intelligence.</p><div class="suggestions"><button data-prompt="Explain Minecraft survival tips">⛏ Minecraft tips</button><button data-prompt="Help me write a website">⌘ Build a website</button><button data-prompt="Teach me Python basics">✧ Learn coding</button><button data-prompt="Give me creative ideas for a project">💡 Brainstorm ideas</button></div></div></section><div class="composer-wrap"><form id="chatForm" class="composer"><textarea id="prompt" placeholder="Message VORTEX AI..." rows="1" maxlength="4000" required></textarea><button id="send" type="submit" aria-label="Send">➤</button></form><div class="disclaimer">AI can make mistakes. Check important information.</div></div></main></div><script src="./app.js" defer></script></body></html>
